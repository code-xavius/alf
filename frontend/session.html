<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurer la session — alf</title>
    <link rel="stylesheet" href="static/css/base.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">[alf]</a>
      <nav>
        <a class="btn" href="dashboard.html">Mes sessions</a>
        <button class="btn" id="logout" type="button">Déconnexion</button>
      </nav>
    </header>

    <main class="container">
      <p class="small"><a href="dashboard.html">← Mes sessions</a></p>

      <div class="row between">
        <h1 id="title">Session</h1>
        <span class="badge" id="code"></span>
      </div>

      <div class="row" style="margin-bottom: 18px">
        <a class="btn solid" id="present-link" href="#">Présenter</a>
        <button class="btn" id="copy-link" type="button">Copier le lien participant</button>
      </div>

      <p id="error" class="error hidden"></p>

      <div class="grid two">
        <section class="card">
          <h2>Réglages</h2>
          <form id="settings-form">
            <div class="field">
              <label for="session-title">Titre</label>
              <input id="session-title" maxlength="200" required />
            </div>
            <div class="field">
              <label for="session-status">Statut</label>
              <select id="session-status">
                <option value="draft">Brouillon</option>
                <option value="live">En direct</option>
                <option value="closed">Terminée</option>
              </select>
            </div>
            <button class="btn solid" type="submit">Enregistrer</button>
          </form>
        </section>

        <section class="card">
          <h2>Ajouter une activité</h2>
          <form id="activity-form">
            <div class="field">
              <label for="kind">Type</label>
              <select id="kind">
                <option value="wordcloud">Nuage de mots</option>
                <option value="poll">Vote en direct</option>
                <option value="quiz">Quiz</option>
                <option value="video">Quiz vidéo / audio</option>
              </select>
            </div>
            <div class="field">
              <label for="activity-title">Titre</label>
              <input id="activity-title" maxlength="200" required />
            </div>
            <div class="field hidden" id="youtube-field">
              <label for="youtube-url">Lien YouTube</label>
              <input id="youtube-url" placeholder="https://www.youtube.com/watch?v=…" />
            </div>
            <button class="btn solid" type="submit">Ajouter</button>
          </form>
        </section>
      </div>

      <h2 style="margin-top: 26px">Activités</h2>
      <div id="activities" class="list"></div>
    </main>

    <script src="static/js/config.js"></script>
    <script src="static/js/alf.js"></script>
    <script src="static/js/session.js"></script>
  </body>
</html>
