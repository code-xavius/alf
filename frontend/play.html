<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Participer — alf</title>
    <link rel="stylesheet" href="static/css/base.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">[alf]</a>
      <div class="row">
        <span class="small muted" id="session-title"></span>
        <span class="badge" id="session-code"></span>
        <span class="small muted" id="nickname-label"></span>
      </div>
    </header>

    <main class="container narrow">
      <section id="join-view" class="card hidden">
        <h1>Rejoindre la session</h1>
        <p class="muted" id="join-title"></p>
        <form id="join-form">
          <div class="field">
            <label for="nickname">Votre pseudo</label>
            <input id="nickname" maxlength="60" autocomplete="nickname" required />
          </div>
          <button class="btn solid" type="submit">Rejoindre</button>
          <p id="join-error" class="error hidden"></p>
        </form>
      </section>

      <section id="activity-view" class="hidden">
        <div class="row between" style="margin-bottom: 14px">
          <span class="badge" id="activity-kind"></span>
          <span class="small muted" id="activity-title"></span>
        </div>
        <div id="activity-content"></div>
      </section>

      <p id="waiting" class="muted hidden">En attente de l'animateur…</p>
      <p id="error" class="error hidden"></p>
    </main>

    <script src="static/js/config.js"></script>
    <script src="static/js/alf.js"></script>
    <script src="static/js/play.js"></script>
  </body>
</html>
