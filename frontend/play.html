<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="static/img/cat-head.svg" type="image/svg+xml" />
    <title>Participer — alf</title>
    <script src="static/js/theme.js"></script>
    <link rel="stylesheet" href="static/css/base.css" />
  </head>
  <body class="play-page">
    <header class="topbar">
      <a class="brand" href="index.html">[alf]</a>
      <div class="row">
        <div class="play-context">
          <span class="small muted play-title" id="activity-title"></span>
          <span class="badge" id="activity-code"></span>
        </div>
        <span class="small muted play-nickname" id="nickname-label"></span>
      </div>
    </header>

    <main class="container narrow">
      <section id="join-view" class="card hidden">
        <h1>Rejoindre l'activité</h1>
        <p class="muted" id="join-title"></p>
        <form id="join-form">
          <div class="field">
            <label for="nickname">Votre pseudo</label>
            <input
              id="nickname"
              maxlength="60"
              autocomplete="nickname"
              autocapitalize="words"
              enterkeyhint="done"
              required
            />
          </div>
          <button class="btn solid" type="submit">Rejoindre</button>
          <p id="join-error" class="error hidden"></p>
        </form>
      </section>

      <section id="activity-view" class="hidden">
        <div class="view-head">
          <span class="badge" id="activity-kind"></span>
          <span class="small muted play-title" id="activity-title-label"></span>
          <span class="badge play-nickname-mobile" id="nickname-chip"></span>
        </div>
        <div id="activity-content"></div>
      </section>

      <p
        id="waiting"
        class="muted waiting-card hidden"
        role="status"
        aria-live="polite"
      >
        En attente de l'animateur…
      </p>
      <p id="error" class="error hidden" role="alert"></p>
    </main>

    <div class="loading-overlay" id="play-loading">
      <div class="loader"></div>
      <p class="muted">Chargement de l'activité…</p>
    </div>

    <script src="static/js/config.js"></script>
    <script src="static/js/alf.js"></script>
    <script src="static/js/play.js"></script>
  </body>
</html>
