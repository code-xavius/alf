<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Présentation — alf</title>
    <script src="static/js/theme.js"></script>
    <link rel="stylesheet" href="static/css/base.css" />
    <link rel="stylesheet" href="static/css/present.css" />
  </head>
  <body class="present-body">
    <header class="topbar">
      <a class="brand" href="dashboard.html">[alf]</a>
      <div class="row">
        <span class="muted small" id="activity-title"></span>
        <span class="badge" id="activity-code"></span>
        <a class="btn small" id="config-link" href="#">Configurer</a>
        <button class="btn small" id="quit" type="button">Quitter</button>
      </div>
    </header>

    <main class="present-layout">
      <section class="stage" id="stage">
        <div class="stage-empty">Chargement…</div>
      </section>

      <aside class="sidebar">
        <div class="card sidebar-card">
          <h2>Rejoindre</h2>
          <div id="qrcode"></div>
          <p class="small" id="join-url"></p>
        </div>

        <div class="card sidebar-card">
          <h2>Participants</h2>
          <p class="participant-total" id="participant-count">0</p>
        </div>
      </aside>
    </main>

    <div class="embed-qr" id="embed-qr" aria-label="QR code pour rejoindre">
      <div id="embed-qrcode"></div>
    </div>

    <script src="static/vendor/qrcode.js"></script>
    <script src="static/vendor/d3.v6.min.js"></script>
    <script src="static/vendor/d3.layout.cloud.min.js"></script>
    <script src="static/js/config.js"></script>
    <script src="static/js/alf.js"></script>
    <script src="static/js/present.js"></script>
  </body>
</html>
