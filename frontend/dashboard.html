<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mes activités — alf</title>
    <link rel="stylesheet" href="static/css/base.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">[alf]</a>
      <nav>
        <span class="muted small" id="user-label"></span>
        <button class="btn" id="logout" type="button">Déconnexion</button>
      </nav>
    </header>

    <main class="container">
      <div class="row between">
        <h1>Mes activités</h1>
      </div>

      <form id="create-form" class="card">
        <h2>Nouvelle activité</h2>
        <div class="grid two">
          <div class="field">
            <label for="activity-kind">Type</label>
            <select id="activity-kind">
              <option value="wordcloud">Nuage de mots</option>
              <option value="poll">Vote en direct</option>
              <option value="quiz">Quiz</option>
            </select>
          </div>
          <div class="field">
            <label for="activity-title">Titre</label>
            <input
              id="activity-title"
              placeholder="Ex. Qu'avez-vous retenu ?"
              maxlength="200"
              required
            />
          </div>
        </div>
        <button class="btn solid" type="submit">Créer l'activité</button>
        <p id="error" class="error hidden"></p>
      </form>

      <div id="activities" class="list"></div>
    </main>

    <script src="static/js/config.js"></script>
    <script src="static/js/alf.js"></script>
    <script src="static/js/dashboard.js"></script>
  </body>
</html>
